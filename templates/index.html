<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход и регистрация</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>
    <div class="login-container">
        <div class="tabs">
            <button class="tab-button active" onclick="openTab('login')">Вход</button>
            <button class="tab-button" onclick="openTab('register')">Регистрация</button>
        </div>

        <!-- Форма авторизации -->
        <div id="login" class="tab-content active">
            <h2>Вход</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginInput">Логин:</label>
                    <input type="text" id="loginInput" name="login" required>
                </div>
                <div class="form-group">
                    <label for="passwordInput">Пароль:</label>
                    <input type="password" id="passwordInput" name="password" required>
                </div>
                <button type="submit">Войти</button>
            </form>
        </div>

        <!-- Форма регистрации -->
        <div id="register" class="tab-content">
            <h2>Регистрация</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="fio">ФИО:</label>
                    <input type="text" id="fio" name="fio" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="registerLogin">Логин:</label>
                    <input type="text" id="registerLogin" name="login" required>
                </div>
                <div class="form-group">
                    <label for="registerPassword">Пароль:</label>
                    <input type="password" id="registerPassword" name="password" required>
                </div>
                <button type="submit">Зарегистрироваться</button>
            </form>
        </div>
    </div>

    <!-- Контейнер для уведомлений -->
    <div id="notification-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 1000;"></div>

    <script>
        // Функция для переключения между вкладками
        function openTab(tabName) {
            const tabs = document.querySelectorAll('.tab-content');
            tabs.forEach(tab => tab.classList.remove('active'));

            const buttons = document.querySelectorAll('.tab-button');
            buttons.forEach(button => button.classList.remove('active'));

            document.getElementById(tabName).classList.add('active');
            document.querySelector(`button[onclick="openTab('${tabName}')"]`).classList.add('active');
        }

        // Обработка формы авторизации
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const login = document.getElementById('loginInput').value;
            const password = document.getElementById('passwordInput').value;

            const formData = {
                login: login,
                password: password
            };

            fetch('https://onlinezapicbek.cloudpub.ru/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include',
                body: JSON.stringify(formData),
            })
            .then(response => {
                if (response.ok) {
                    window.location.href = '/dashboard.html';
                } else {
                    return response.json().then(data => {
                        showNotification(data.message || 'Неправильный логин или пароль', 5000);
                    });
                }
            })
            .catch(error => {
                console.error('Ошибка:', error);
                showNotification('Ошибка при входе в систему', 5000);
            });
        });

        // Обработка формы регистрации
        document.getElementById('registerForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const formData = {
                fio: document.getElementById('fio').value,
                email: document.getElementById('email').value,
                login: document.getElementById('registerLogin').value,
                password: document.getElementById('registerPassword').value
            };

            fetch('https://onlinezapicbek.cloudpub.ru/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include',
                body: JSON.stringify(formData)
            })
            .then(response => {
                if (response.ok) {
                    showNotification('Регистрация прошла успешно', 5000);
                    window.location.href = '/dashboard.html';
                } else {
                    return response.json().then(data => {
                        showNotification(data.message || 'Ошибка при регистрации', 5000);
                    });
                }
            })
            .catch(error => {
                console.error('Ошибка:', error);
                showNotification('Ошибка при регистрации', 5000);
            });
        });

        // Функция для показа уведомлений
        function showNotification(message, duration = 7000) {
            const audio = new Audio('/notification.mp3');
            audio.play().catch(error => console.error("Ошибка воспроизведения звука:", error));

            const notification = document.createElement('div');
            notification.className = 'custom-notification';
            notification.innerHTML = message.replace(/\n/g, '<br>');

            const progressBar = document.createElement('div');
            progressBar.className = 'progress-bar';
            notification.appendChild(progressBar);

            const container = document.getElementById('notification-container');
            container.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, duration);
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</body>
</html>
